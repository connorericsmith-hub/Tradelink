[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cold-outreach-lead-pipeline"
version = "1.0.0"
description = "Config-driven Google Maps lead scraper: scrape, filter, categorize, score, and export local business leads for cold outreach."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["lead-generation", "google-maps", "scraper", "cold-outreach", "sms", "crm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]

dependencies = [
    "phonenumbers>=8.13,<10",
    "PyYAML>=6.0,<7",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9"]

[project.scripts]
leadpipe = "leadpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
